[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bubblekit"
version = "0.1.0"
description = "Asset-price bubble detection: explosive-root, volatility-tail and strict-local-martingale signals with calibration and comparison tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/bubblekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: cross-checks against the research lab's reference code (skipped outside the repository)"]
