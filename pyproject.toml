[project]
name = "lab"
version = "0.1.0"
description = "Lab tooling (work queue, CI) and the project's checks; add the project's own dependencies below"
requires-python = ">=3.12"
dependencies = [
    "mpmath>=1.3.0",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-flint==0.8.0",
    "pyyaml>=6.0",   # the work queue and claim parser read YAML front matter; `uv run` failed without it
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[tool.uv]
package = false
